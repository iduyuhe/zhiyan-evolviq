# 智衍 Studio Nginx 配置
# 前端静态文件 + API代理到Runtime

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 关键：使用 Docker 内置 DNS 动态解析上游服务名（runtime）。
    # 默认 nginx 在启动时一次性解析 proxy_pass 的 hostname 并长期缓存；
    # runtime 容器重建后 IP 变化，旧 IP 不可达 → 502。
    # 改用变量 + resolver 后，每次请求实时解析，彻底根治重建后 502。
    # 注意：proxy_pass 仅放变量（host），路径去前缀用 rewrite 显式完成，
    # 避免“变量+URI”组合导致 POST 被改写为 GET 的坑。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 启用 gzip 压缩：显著缩小 JS/CSS 传输体积（约 427KB → 130KB），降低公网加载慢导致的白屏概率
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 静态文件
    location / {
        try_files $uri $uri/ /index.html;
        # 入口 HTML 禁止长缓存：每次都重新校验，确保拿到最新的带 hash bundle，
        # 否则旧 HTML 指向已被 vite 清空的旧 bundle → 404 → 白屏/进不去。
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 带内容 hash 的构建产物（index-<hash>.js/.css 等）可永久缓存，安全且提速
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API代理到Runtime后端（动态解析 runtime 容器 IP，显式去掉 /api 前缀）
    location /api/ {
        set $runtime_upstream "runtime:8000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$runtime_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 模式 C 活动专属短链：/e/{id} 代理到 Runtime 重定向到 intake 落地页（动态解析）
    location /e/ {
        set $runtime_upstream "runtime:8000";
        proxy_pass http://$runtime_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
